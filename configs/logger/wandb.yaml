# https://wandb.ai

wandb:
  _target_: lightning.pytorch.loggers.wandb.WandbLogger
  # name: "" # name of the run (normally generated by wandb)
  save_dir: "${paths.output_dir}"
  offline: False
  id: null # pass correct id to resume experiment!
  anonymous: null # enable anonymous logging
  project: "CSC2539"  # Your W&B project name
  log_model: True # upload lightning ckpts (set to True to save model checkpoints to W&B)
  prefix: "" # a string to put at the beginning of metric keys
  entity: "mickell-als10-tco" # TODO: Replace with your W&B username or team name
  group: ""
  tags: ["non_valid"]  # Tags to organize your runs
  job_type: ""
